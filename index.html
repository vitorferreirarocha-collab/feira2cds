<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="game">

    <div>
      <canvas id="tetris" width="300" height="600"></canvas>

      <div class="player-form">
        <input type="text" id="playerName" placeholder="Seu nome">
        <input type="text" id="playerClass" placeholder="Sua turma">
      </div>
    </div>

    <div class="side">

      <h1>TETRIS</h1>

      <div class="info">
        <p>Pontos: <strong id="score">0</strong></p>
        <p>Linhas: <strong id="lines">0</strong></p>
        <p>Nível: <strong id="level">1</strong></p>
      </div>

      <button onclick="restartGame()">
        Reiniciar
      </button>

      <button onclick="toggleMusic()" class="music-button">
        🎵 Música: <span id="musicStatus">OFF</span>
      </button>

      <div class="controls">
        ← → &nbsp; Mover<br>
        ↓ &nbsp; Acelerar<br>
        ↑ &nbsp; Girar<br>
        Espaço &nbsp; Queda rápida
      </div>

      <div class="ranking">

        <h2>🏆 Ranking</h2>

        <ol id="rankingList"></ol>

      </div>

    </div>

  </div>

  <!-- Música -->
  <audio id="arcadeMusic" loop>
    <source src="arcade.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>

</body>
</html>
