<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="startScreen" class="start-screen">

  <div class="start-box">

    <h1>TETRIS</h1>

    <p class="subtitle">ARCADE EDITION</p>

    <div class="blocks">
      <span>🟦</span>
      <span>🟨</span>
      <span>🟪</span>
      <span>🟩</span>
      <span>🟥</span>
    </div>

    <button onclick="startGame()">
      ▶ JOGAR
    </button>

    <button onclick="showRanking()">
      🏆 RANKING
    </button>

    <p class="copyright">
      Pressione JOGAR para começar
    </p>

  </div>

</div>

  <div class="game">

    <div class="game-area">

      <canvas id="tetris" width="300" height="600"></canvas>

      <div class="player-form">
        <input
          type="text"
          id="playerName"
          placeholder="Nome"
          maxlength="20"
        >

        <input
          type="text"
          id="playerClass"
          placeholder="Turma"
          maxlength="15"
        >
      </div>

    </div>

    <div class="side">

      <h1>TETRIS</h1>

      <div class="info">
        <p>Pontos: <strong id="score">0</strong></p>
        <p>Linhas: <strong id="lines">0</strong></p>
        <p>Nível: <strong id="level">1</strong></p>
      </div>

      <button onclick="restartGame()">
        Reiniciar
      </button>

      <button
        onclick="toggleMusic()"
        class="music-button"
      >
        🎵 Música:
        <span id="musicStatus">OFF</span>
      </button>

      <div class="controls">
        ← → &nbsp; Mover<br>
        ↓ &nbsp; Acelerar<br>
        ↑ &nbsp; Girar<br>
        Espaço &nbsp; Queda rápida
      </div>

      <div class="ranking">

        <h2>🏆 Ranking</h2>

        <ol id="rankingList"></ol>

      </div>

    </div>

  </div>

  <audio id="arcadeMusic" loop>
    <source src="arcade.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>

</body>
</html><audio id="arcadeMusic" loop>
  <source src="arcade.mp3" type="audio/mpeg">
</audio>
